[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parksmart-backend"
version = "0.1.0"
description = "ParkSMART AI-Powered Smart City Parking and Commercial Loading Management Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "argon2-cffi",
    "pyjwt",
    "aiomqtt",
    "geoalchemy2",
    "shapely==2.2.0",
    "numpy",
    "pandas",
    "statsmodels",
    "httpx",
    "structlog",
    "apscheduler",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "app.deps.Depends",
    "app.deps.require_roles",
]
