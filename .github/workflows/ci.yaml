name: scaffold-checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AGENT_X_OPERATOR_TOKEN: ci-operator-only
      AGENT_X_SANDBOX_TOKEN: ci-sandbox-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -c requirements.lock -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_openapi.py --check
      - name: Validate and build containers
        run: docker compose --profile sandbox config --quiet
      - run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Live consumer smoke against product sandbox profile
        run: |
          docker compose --profile sandbox up --build --wait
          python scripts/smoke.py
      - name: Container logs
        if: failure()
        run: docker compose --profile sandbox logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose --profile sandbox down
