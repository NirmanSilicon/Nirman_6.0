services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aftershock
      POSTGRES_USER: aftershock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aftershock_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aftershock -d aftershock"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aftershock:${POSTGRES_PASSWORD:-aftershock_secret}@db:5432/aftershock
      PORT: 8000
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
