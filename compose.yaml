name: agent-x

x-runtime: &runtime
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [agent-x]
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  product:
    <<: *runtime
    profiles: [production]
    environment:
      AGENT_X_PROFILE: production
      AGENT_X_OPERATOR_TOKEN: ${AGENT_X_OPERATOR_TOKEN:?Copy .env.example to .env and set an operator token}
    ports: ["127.0.0.1:${AGENT_X_PRODUCT_PORT:-8000}:8000"]
    volumes: [product-data:/app/data]

  product-sandbox:
    <<: *runtime
    profiles: [sandbox]
    environment:
      AGENT_X_PROFILE: sandbox
      AGENT_X_OPERATOR_TOKEN: ${AGENT_X_OPERATOR_TOKEN:?Set AGENT_X_OPERATOR_TOKEN in .env}
      AGENT_X_SANDBOX_TOKEN: ${AGENT_X_SANDBOX_TOKEN:?Set AGENT_X_SANDBOX_TOKEN in .env}
    ports: ["127.0.0.1:${AGENT_X_PRODUCT_PORT:-8000}:8000"]
    volumes: [sandbox-product-data:/app/data]

  sandbox:
    <<: *runtime
    profiles: [sandbox]
    command: [uvicorn, "agent_x_sandbox.app:create_app", --factory, --host, "0.0.0.0", --port, "8000"]
    environment:
      AGENT_X_PRODUCT_URL: http://product-sandbox:8000
      AGENT_X_DASHBOARD_URL: http://localhost:${AGENT_X_PRODUCT_PORT:-8000}
      AGENT_X_SANDBOX_TOKEN: ${AGENT_X_SANDBOX_TOKEN:?Set AGENT_X_SANDBOX_TOKEN in .env}
    ports: ["127.0.0.1:${AGENT_X_SANDBOX_PORT:-8080}:8000"]
    depends_on:
      product-sandbox:
        condition: service_healthy

volumes:
  product-data:
  sandbox-product-data:

networks:
  agent-x:
    driver: bridge
