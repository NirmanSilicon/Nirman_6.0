    <path d="M 215 50 C 235 50, 275 80, 275 115 C 245 115, 205 85, 205 60 Z" fill="#227B38" stroke="#000000" stroke-width="4" />

    <!-- Yellow Band -->
    <path d="M 95 118 C 140 100, 260 100, 305 118 L 315 145 C 260 122, 140 122, 85 145 Z" fill="#F7B100" stroke="#000000" stroke-width="4" stroke-linejoin="round" />

