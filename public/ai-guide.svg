<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- LAYER 1: YELLOW KURTA BODY & SHOULDERS -->
  <g id="body">
    <path d="M 100 350 C 110 275, 290 275, 300 350 C 290 380, 110 380, 100 350 Z" fill="#F7B100" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <path d="M 135 315 C 160 305, 175 325, 175 345" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <path d="M 265 315 C 240 305, 225 325, 225 345" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- LAYER 2: EARS & HEAD SHAPE -->
  <g id="head">
    <!-- Left Ear -->
    <path d="M 135 180 C 100 180, 100 215, 135 215 Z" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <path d="M 125 192 C 120 197, 120 205, 127 207" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />
    <!-- Right Ear -->
    <path d="M 265 180 C 300 180, 300 215, 265 215 Z" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <path d="M 275 192 C 280 197, 280 205, 273 207" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" />

    <!-- Face Shape -->
    <path d="M 135 145 L 135 235 C 135 285, 265 285, 265 235 L 265 145 Z" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />

    <!-- Eyebrows -->
    <path d="M 142 180 C 150 165, 175 165, 183 180" fill="#000000" stroke="#000000" stroke-width="7" stroke-linecap="round" />
    <path d="M 217 180 C 225 165, 250 165, 258 180" fill="#000000" stroke="#000000" stroke-width="7" stroke-linecap="round" />

    <!-- Eyes (Peaceful curved arcs) -->
    <path d="M 152 188 C 152 208, 173 208, 173 188" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    <path d="M 227 188 C 227 208, 248 208, 248 188" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 190 152 L 190 220 C 180 238, 220 238, 210 220 L 210 152" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- LAYER 3: MUSTACHE & SMILING MOUTH -->
  <g id="mouth-mustache">
    <!-- Smiling Mouth -->
    <path d="M 183 252 Q 200 270 217 252 Z" fill="#FFFFFF" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
    <!-- Mustache -->
    <path d="M 200 240 C 170 215, 110 215, 90 218 C 115 260, 160 262, 200 248 C 240 262, 285 260, 310 218 C 290 215, 230 215, 200 240 Z" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- LAYER 4: NAMASTE HANDS -->
  <g id="hands">
    <path d="M 168 325 C 165 348, 178 355, 185 345 L 198 270 C 199 265, 196 265, 194 270 Z" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <path d="M 232 325 C 235 348, 222 355, 215 345 L 202 270 C 201 265, 204 265, 206 270 Z" fill="#E5A67A" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
    <line x1="200" y1="268" x2="200" y2="335" stroke="#000000" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- LAYER 5: AUTHENTIC DECORATED RAJASTHANI TURBAN (SAFA) -->
