[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostsight"
dynamic = ["version"]
description = "AI-Powered Automated Vulnerability Assessment and Security Validation CLI"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ghostsight = "ghostsight.main:app"

[tool.setuptools.dynamic]
version = {attr = "ghostsight.__version__"}

[tool.setuptools.packages.find]
include = ["ghostsight*"]
