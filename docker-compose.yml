version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: smartppe-local-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartppe-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/smartppe_wardens_eye
      JWT_SECRET: ${JWT_SECRET:-replace_with_production_32_byte_jwt_secret}
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-replace_with_production_ml_service_key}
      WARNING_GRACE_SECONDS: 120
      INCIDENT_COOLDOWN_SECONDS: 60
      RFID_COOLDOWN_SECONDS: 10
      DEVICE_HEARTBEAT_TIMEOUT_SECONDS: 90
    volumes:
      - ./frontend:/usr/src/app/frontend:ro
      - ./storage:/usr/src/app/storage

volumes:
  mongodb_data:
