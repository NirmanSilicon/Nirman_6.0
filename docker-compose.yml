name: ouroboros
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ouroboros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ouroboros}
      POSTGRES_DB: ${POSTGRES_DB:-ouroboros}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ouroboros} -d ${POSTGRES_DB:-ouroboros}"]
      interval: 5s
      retries: 20

  objectstore:   # local S3-compatible store; point S3_* at Cloudflare R2 / AWS S3 in production
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    volumes: [objectdata:/data]

  inference:
    build:
      context: ./inference
      args: { INSTALL_ML: "${INSTALL_ML:-1}" }
    environment:
      INFERENCE_MODE: ${INFERENCE_MODE:-auto}
      MODELS_DIR: /models
    volumes: ["./models:/models:ro"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      objectstore: { condition: service_started }
      inference: { condition: service_healthy }
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ouroboros}:${POSTGRES_PASSWORD:-ouroboros}@db:5432/${POSTGRES_DB:-ouroboros}
      INFERENCE_URL: http://inference:8001
      S3_ENDPOINT: ${S3_ENDPOINT:-http://objectstore:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ouroboros}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-ouroboros-secret}
      S3_BUCKET: ${S3_BUCKET:-ouroboros-scans}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["${APP_PORT:-8080}:8000"]

volumes:
  pgdata:
  objectdata:
