services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "8883:8883"
    volumes:
      - ./infra/mosquitto:/mosquitto/config:ro

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    volumes:
      # Mount root repository so scripts (seed_demo), simulator, and tests run inside api container
      - .:/srv
    environment:
      - PYTHONPATH=/srv/backend:/srv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    command: python -m app.workers.scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/srv
    environment:
      - PYTHONPATH=/srv/backend:/srv
    deploy:
      replicas: 1
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20
    working_dir: /app
    volumes:
      - ./web:/app
    command: npm run dev -- --host
    env_file: .env
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
