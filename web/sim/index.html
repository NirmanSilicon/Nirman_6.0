<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashvin simulation — Bhubaneswar</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/sim/vendor/leaflet.css" />
  <link rel="stylesheet" href="/sim/sim.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo-group">
        <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <polygon points="12,3 22,20 2,20" fill="#2563eb" />
          <polygon points="12,9 16.5,17.5 7.5,17.5" fill="#ffffff" />
        </svg>
        <span class="logo-word">Ashvin</span>
      </div>
      <span class="nav-divider" aria-hidden="true"></span>
      <nav class="top-tabs" aria-label="Simulator views">
        <span class="top-tab">Scenario Simulator</span>
        <span class="top-tab active">Bhubaneswar</span>
        <span class="top-sub">Simulated Incident Stream</span>
      </nav>
    </div>
    <div class="top-meta">
      <button id="full-incident-btn" type="button" class="primary-btn">
        <svg viewBox="0 0 14 14" width="12" height="12" fill="currentColor" aria-hidden="true">
          <polygon points="3,2 12,7 3,12" />
        </svg>
        <span>Run full incident</span>
      </button>
      <a href="/" target="_blank" rel="noopener" class="stream-link">
        <span>Open stream view</span>
        <span aria-hidden="true">&#8599;</span>
      </a>
    </div>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Bhubaneswar scenario map">
      <div id="map"></div>
    </section>

    <aside id="panel" class="panel" tabindex="-1" aria-label="Scenario controls" hidden>
      <div class="panel-head">
        <div class="panel-title-wrap">
          <div id="scenario-kicker" class="kicker">Scenario</div>
          <h2 id="scenario-title">Select a marker</h2>
        </div>
        <div class="panel-head-actions">
          <button id="reset-log-btn" type="button" class="reset-btn">Reset log</button>
          <button id="close-panel" type="button" class="close-btn" aria-label="Close panel">&times;</button>
        </div>
      </div>

      <div id="mode-section" class="section">
        <div class="label">Mode</div>
        <div id="mode-list" class="modes" role="group" aria-label="Scenario modes"></div>
      </div>

      <div class="actions">
        <button id="start-btn" type="button" class="start-btn">Start</button>
        <div class="alert-wrap">
          <span class="label inline">Alert</span>
          <span id="sim-alert" class="badge">idle</span>
        </div>
      </div>

      <div id="run-meta" class="run-meta mono"></div>

      <div id="sms-box" class="sms-box" hidden>
        <div id="sms-status" class="sms-note" hidden></div>
        <div id="sms-bubble" class="sms-bubble" hidden>
          <div id="sms-body" class="mono sms-body"></div>
          <div id="sms-chars" class="sms-chars"></div>
        </div>
        <div id="sms-delivered" class="sms-note" hidden></div>
      </div>

      <div id="scene-wrap" class="scene-wrap" hidden>
        <div class="scene-bar">
          <span class="label inline">3D simulation</span>
          <button id="scene-close" type="button" class="scene-close-btn">Close</button>
        </div>
        <div id="scene-host" class="scene-host"></div>
      </div>

      <div class="section log-section">
        <div class="label">Sent events</div>
        <ol id="sim-log" class="sim-log"></ol>
      </div>
    </aside>
  </main>

  <script src="/sim/vendor/leaflet.js"></script>
  <script type="module" src="/sim/sim.js"></script>
</body>
</html>
