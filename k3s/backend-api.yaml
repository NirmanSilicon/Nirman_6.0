apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: vidyutsync
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: vidyutsync/backend:latest
          envFrom:
            - configMapRef:
                name: vidyutsync-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  namespace: vidyutsync
spec:
  selector:
    app: backend-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
