apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: vidyutsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          ports:
            - containerPort: 1883
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  namespace: vidyutsync
spec:
  selector:
    app: mosquitto
  ports:
    - port: 1883
      targetPort: 1883
