   if(tok){

function DetectionBoxPreview({det}){
 const boxes=Array.isArray(det.detections)?det.detections:[];
 const isViol=det.detectionState==="VIOLATION";
 return <svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" style={{position:"absolute",inset:0,width:"100%",height:"100%",background:"#11161b"}}>
  <rect width="640" height="230" fill="#232c33"/><polygon points="0,230 640,230 640,360 0,360" fill="#181f24"/>
  <line x1="0" y1="230" x2="640" y2="230" stroke="#394651" strokeWidth="2"/>
  {boxes.map((b,idx)=>{
   const [x1=180,y1=80,x2=320,y2=310]=Array.isArray(b.bbox)?b.bbox:[180,80,320,310];
   const sx=Math.max(10,Math.min(600,x1)),sy=Math.max(18,Math.min(330,y1));
   const sw=Math.max(36,Math.min(620-sx,x2-x1||90)),sh=Math.max(36,Math.min(350-sy,y2-y1||140));
   const bad=["no_helmet","no_vest","no_boots","fire","smoke"].includes(b.classLabel);
   const col=bad?"#e53e3e":b.classLabel==="person"?"#38a169":"#3182ce";
   return <g key={idx}>
    <rect x={sx} y={sy} width={sw} height={sh} fill={bad?"rgba(229,62,62,0.12)":"rgba(56,161,105,0.08)"} stroke={col} strokeWidth="3"/>
    <rect x={sx} y={Math.max(0,sy-20)} width={Math.min(200,String(b.classLabel).length*9+54)} height="20" fill={col}/>
    <text x={sx+5} y={Math.max(14,sy-6)} fill="#fff" fontSize="12" fontFamily="monospace" fontWeight="700">{b.classLabel} {Math.round((b.confidence||0.85)*100)}%</text>
   </g>;
  })}
  {!boxes.length&&<text x="320" y="185" textAnchor="middle" fill={isViol?"#fc8181":"#68d391"} fontSize="16" fontFamily="monospace" fontWeight="700">{det.detectionState} FRAME RECORDED ({det.cameraCode})</text>}
 </svg>;
}

  }catch(_e){setErr("Network error creating supervisor")}finally{setBusy(false)}
 };
 const resetPass=async e=>{
  e.preventDefault();if(!editSup||!newPass)return;setMsg("");setErr("");
  try{
   const tok=localStorage.getItem("we-token");
   const r=await fetch(`${API_BASE}/admin/supervisors/${editSup.userId||editSup._id}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},
    body:JSON.stringify({password:newPass,status:"ACTIVE"})
   });
   const j=await r.json();
   if(r.ok){
    setMsg(`✓ Password updated for ${editSup.email} in MongoDB Atlas!`);
    setEditSup(null);setNewPass("");await loadSups();
   }else{setErr(j.message||"Could not update password")}

 };
 const assignZoneToSup=async(supId,zoneMongoId)=>{

   const tok=localStorage.getItem("we-token");

    method:"POST",

 };
 const removeSup=async sup=>{

   const tok=localStorage.getItem("we-token");

 };
 if(!isHigherAuthority){

   <button className="btn red" onClick={()=>go("signin")}>Switch to Higher Authority Account</button>
  </div>;
 }
 return <div className="grid" style={{gap:16}}>
  <div className="card" style={{borderLeft:"4px solid var(--red)"}}>
   <div className="row"><h3>Higher Authority — Create Supervisor ID &amp; Password (MongoDB Atlas)</h3><span className="bd g">Role: Higher Authority</span></div>
   <p style={{margin:"4px 0 12px",fontSize:14,color:"var(--mut)"}}>Create a new Supervisor Login ID (e.g. <code>sup01@smartppe.local</code> or <code>sup_zone_b</code>) and Password. The Supervisor can immediately sign in on the Sign-In page using these credentials.</p>
   {msg&&<div className="bd g" style={{padding:"8px 12px",marginBottom:10,fontSize:14}}>{msg}</div>}
   {err&&<div className="bd r" style={{padding:"8px 12px",marginBottom:10,fontSize:14}}>{err}</div>}
   <form onSubmit={createSup} className="grid g4" style={{alignItems:"end"}}>
    <label>Supervisor Full Name<input className="in" placeholder="e.g. Bikash Pattnaik" value={name} onChange={e=>setName(e.target.value)} required/></label>
    <label>Supervisor Login ID / Email<input className="in" placeholder="e.g. sup01 or sup.bikash@smartppe.local" value={loginId} onChange={e=>setLoginId(e.target.value)} required/></label>
    <label>Set Password (min 6 chars)<input className="in" type="text" placeholder="e.g. Sup@2026!" value={pass} onChange={e=>setPass(e.target.value)} minLength={6} required/></label>
    <label>Initial Workplace Zone<select className="in" value={selZone} onChange={e=>setSelZone(e.target.value)}><option value="ALL_ACTIVE">All Active Zones (Recommended)</option>{zones.filter(z=>z.mongoId&&z.on).map(z=><option key={z.mongoId} value={z.mongoId}>{z.name} ({z.code})</option>)}<option value="NONE">No initial zone</option></select></label>
    <div style={{gridColumn:"1 / -1",display:"flex",justifyContent:"flex-end"}}><button className="btn red" disabled={busy}><Ic n="plus"/>{busy?"Creating in MongoDB Atlas...":"Create Supervisor ID & Password"}</button></div>
   </form>
  </div>
  <div className="card tw">
   <div className="row" style={{marginBottom:10}}><h3>Registered Supervisors in MongoDB Atlas ({sups.length})</h3><button className="btn" onClick={loadSups}>Refresh List</button></div>
   <table><thead><tr><th>Supervisor Name</th><th>Supervisor Login ID / Email</th><th>Role</th><th>Assigned Zones</th><th>Assign Zone</th><th>Status</th><th>Actions</th></tr></thead>
   <tbody>
    {sups.map(s=><tr key={s.userId||s._id}>
     <td><b>{s.name}</b></td>
     <td><code>{s.email}</code></td>
     <td><span className="bd">SUPERVISOR</span></td>
     <td>{(s.assignedZones&&s.assignedZones.length)?s.assignedZones.map(z=>z.zoneName||z.zoneCode).join(", "):"No zone assigned"}</td>
     <td><select className="in" style={{height:34,fontSize:13}} value="" onChange={e=>assignZoneToSup(s.userId||s._id,e.target.value)}><option value="">+ Assign zone…</option>{zones.filter(z=>z.mongoId&&z.on).map(z=><option key={z.mongoId} value={z.mongoId}>{z.name}</option>)}</select></td>
     <td><Badge s={s.status==="ACTIVE"?"Active":"Inactive"}/></td>
     <td><button className="btn" onClick={()=>{setEditSup(s);setNewPass("")}}>Reset Password</button> <button className="btn" onClick={()=>removeSup(s)}><Ic n="trash"/></button></td>
    </tr>)}
    {!sups.length&&<tr><td colSpan="7">No supervisors found. Use the form above to create a Supervisor ID and Password.</td></tr>}
   </tbody></table>
  </div>
  {editSup&&<div className="modal" onClick={()=>setEditSup(null)}><form className="card" onSubmit={resetPass} onClick={e=>e.stopPropagation()}><div className="row"><h3>Reset Password for {editSup.name}</h3><button type="button" className="btn" onClick={()=>setEditSup(null)}><Ic n="x"/></button></div><p style={{margin:0,color:"var(--mut)"}}>Supervisor ID: <code>{editSup.email}</code></p><label>New Password (min 6 chars)<input className="in" type="text" placeholder="Enter new password" value={newPass} onChange={e=>setNewPass(e.target.value)} minLength={6} required autoFocus/></label><button className="btn red">Update Supervisor Password in MongoDB</button></form></div>}
 </div>}

function CloudConsole(){
 const [syncSt,setSyncSt]=useState(null);const [connSt,setConnSt]=useState(null);const [plans,setPlans]=useState([]);const [busy,setBusy]=useState(false);const [msg,setMsg]=useState("");
 const loadCloud=async()=>{
  try{
   const tok=localStorage.getItem("we-token");
   const [cr,pr,sr]=await Promise.all([
    fetch(`${API_BASE}/health/connectivity`),
    fetch(`${API_BASE}/subscriptions/plans`),
    tok?fetch(`${API_BASE}/sync/status`,{headers:{Authorization:`Bearer ${tok}`}}):Promise.resolve(null)
   ]);
   if(cr.ok){const cj=await cr.json();setConnSt(cj.data)}
   if(pr.ok){const pj=await pr.json();setPlans(pj.data?.plans||[])}
   if(sr&&sr.ok){const sj=await sr.json();setSyncSt(sj.data)}
  }catch(_e){}
 };
 useEffect(()=>{
  loadCloud();
  const id=setInterval(loadCloud,3000);
  return()=>clearInterval(id);
 },[]);
 const triggerCloudSync=async()=>{
  setBusy(true);setMsg("Running Edge-to-Cloud Sync Cycle...");
  try{
   const tok=localStorage.getItem("we-token");
   const r=await fetch(`${API_BASE}/sync/run`,{method:"POST",headers:{Authorization:`Bearer ${tok}`}});
   const j=await r.json();
   const cyc=j.data?.cycleResult||{};
   setMsg(`Cloud Sync Complete — Attempted: ${cyc.attempted??0}, Synced: ${cyc.synced??0}, Failed: ${cyc.failed??0}`);
   await loadCloud();
  }catch(_e){setMsg("Cloud sync cycle failed")}finally{setBusy(false)}
 };
 const createBackup=async()=>{
  setBusy(true);setMsg("Verifying local-to-cloud idempotency & outbox integrity...");
  await triggerCloudSync();
 };
 const outbox=syncSt?.recentOutbox||[];
 return <div className="grid" style={{gap:16}}>
  <div className="card" style={{display:"flex",flexWrap:"wrap",gap:16,alignItems:"center",justifyContent:"space-between",borderLeft:"4px solid var(--grn)"}}>
   <div>
    <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
     <span className="pill live" style={{margin:0}}><span className="dot"/>Edge-to-Cloud Outbox Engine Active ({connSt?.mode||"OFFLINE_FIRST_HYBRID"})</span>
     <span className="bd g">State: {syncSt?.cloudSyncState||"ONLINE_SYNCED"}</span>
     <button className="btn grn" disabled={busy} onClick={triggerCloudSync}>☁️ Sync Local Outbox to Cloud Now</button>
    </div>
    <p style={{margin:"6px 0 0",fontSize:14,color:"var(--mut)"}}>
     Offline-First Local MongoDB (`127.0.0.1:27017`) automatically queues Incidents, RFID attendance scans, and Sensor hazards into `SyncOutbox` with cryptographic idempotency keys (`entityType:entityId:versionTag`) and exponential backoff retry (`min(300s, 2^retry * 5s)`).
    </p>
    {msg&&<div className="bd g" style={{marginTop:8,padding:"6px 10px"}}>{msg}</div>}
   </div>
   <div style={{display:"flex",gap:12}}>
    <div className="stat"><b style={{color:"var(--amb)"}}>{syncSt?.pendingCount??0}</b><span>Pending Outbox</span></div>
    <div className="stat"><b style={{color:"var(--grn)"}}>{syncSt?.syncedCount??0}</b><span>Cloud Synced</span></div>
    <div className="stat"><b style={{color:(syncSt?.failedRetryCount||0)>0?"var(--red)":"inherit"}}>{syncSt?.failedRetryCount??0}</b><span>Failed / Retry</span></div>
   </div>
  </div>
  <div className="card tw">
   <div className="row" style={{marginBottom:10}}><h3>Cloud SyncOutbox Queue (`syncoutboxes` MongoDB Collection)</h3><button className="btn" onClick={createBackup}>Re-verify Batch Idempotency</button></div>
   <table><thead><tr><th>Outbox ID</th><th>Entity Type</th><th>Entity ID</th><th>Idempotency Key</th><th>Retries</th><th>Sync Status</th><th>Timestamp</th></tr></thead>
   <tbody>
    {outbox.map(item=><tr key={item.outboxId||item.idempotencyKey}>
     <td><code>{(item.outboxId||"").slice(-8).toUpperCase()}</code></td>
     <td><b>{item.entityType}</b></td>
     <td><code>{item.entityId}</code></td>
     <td><small>{item.idempotencyKey}</small></td>
     <td>{item.retryCount||0}</td>
     <td><Badge s={item.syncStatus==="SYNCED"?"Resolved":item.syncStatus==="PENDING"?"In Progress":"Pending"}/> <small>{item.syncStatus}</small></td>
     <td>{item.syncedAt?new Date(item.syncedAt).toLocaleTimeString("en-GB"):item.createdAt?new Date(item.createdAt).toLocaleTimeString("en-GB"):"—"}</td>
    </tr>)}
    {!outbox.length&&<tr><td colSpan="7">No outbox events queued yet. Trigger an RFID scan in Attendance or a camera violation in Live Monitoring to watch it queue &amp; sync to Cloud!</td></tr>}
   </tbody></table>
  </div>
  <div className="grid g3">
   {plans.map(p=><div className="card" key={p.tier}>
    <div className="row"><h3>{p.name} Cloud Tier</h3><Badge s={p.tier==="PROFESSIONAL"?"Active":"Present"}/></div>
    <p style={{fontSize:22,fontWeight:700,margin:"4px 0"}}>₹{(p.monthlyPriceInr||0).toLocaleString("en-IN")}<small style={{fontSize:13,color:"var(--mut)",fontWeight:400}}> / month</small></p>
    <p style={{margin:"4px 0",fontSize:14,color:"var(--mut)"}}>Sites: <b>{p.limits?.maxSites}</b> · Zones: <b>{p.limits?.maxZones}</b> · Cameras: <b>{p.limits?.maxCameras}</b> · Workers: <b>{p.limits?.maxWorkers}</b></p>
    <small style={{color:"var(--grn)",fontWeight:600}}>✓ Multi-Tenant Cloud Sync &amp; SHA-256 Audit Chain Included</small>
   </div>)}
  </div>
 </div>}

function Shell({page,dark,setDark,curUser,setCurUser,onLogout}){
 const [pin,setPin]=useState(false);const [hov,setHov]=useState(false);const ex=pin||hov;const [open,setOpen]=useState(false);const [zones,setZones]=useState([]);const [dbWorkers,setDbWorkers]=useState([]);const [dbOnline,setDbOnline]=useState(false);const [dbInfo,setDbInfo]=useState(null);const [cloudSync,setCloudSync]=useState(null);
 const loadMongoData=async()=>{
  try{
   const h=await fetch(`${API_BASE}/health`);
   if(h.ok){const hj=await h.json();setDbOnline(Boolean(hj.data?.databaseConnected));setDbInfo(hj.data)}
   const tok=localStorage.getItem("we-token");
   if(!tok){onLogout();return}
   const [mr,zr,wr,sr]=await Promise.all([
    fetch(`${API_BASE}/auth/me`,{headers:{Authorization:`Bearer ${tok}`}}),
    fetch(`${API_BASE}/zones`,{headers:{Authorization:`Bearer ${tok}`}}),
    fetch(`${API_BASE}/workers`,{headers:{Authorization:`Bearer ${tok}`}}),
    fetch(`${API_BASE}/sync/status`,{headers:{Authorization:`Bearer ${tok}`}})
   ]);
   if(mr.status===401||mr.status===403){
    onLogout();return;
   }
   if(mr.ok){
    const mj=await mr.json();
    if(mj.data?.user){setCurUser(mj.data.user);try{localStorage.setItem("we-user",JSON.stringify(mj.data.user))}catch(_e){}}
   }
   if(zr.ok){
    const zj=await zr.json();
    if(Array.isArray(zj.data?.zones)){
     setZones(zj.data.zones.map((z,i)=>{
      const zid=z.zoneId||z._id||z.id;
      return {
       id:zid||i+1,
       mongoId:zid,
       code:z.zoneCode,
       name:z.zoneName,
       on:z.status==="ACTIVE",
       mon:z.status==="ACTIVE"?"Active":"Inactive"
      };
     }));
    }
   }
   if(wr.ok){
    const wj=await wr.json();
    if(Array.isArray(wj.data?.workers))setDbWorkers(wj.data.workers);
   }
   if(sr.ok){
    const sj=await sr.json();
    if(sj.data)setCloudSync(sj.data);
   }
  }catch(_e){}
 };
 useEffect(()=>{
  loadMongoData();
  const id=setInterval(loadMongoData,5000);
  return()=>clearInterval(id);
 },[]);
 const isH=HIST.some(h=>h[0]===page);
 const [hist,setHist]=useState(()=>isH);
 useEffect(()=>{if(isH)setHist(true)},[isH]);
 const title=(ALL.find(n=>n[0]===page)||["","","Dashboard"])[2];
 const visibleNav=NAV.filter(x=>x[0]!=="supervisors"||!curUser||curUser.role==="ADMINISTRATOR");
 const it=([h,i,l],sub)=><button key={h} className={"nv "+(sub?"sub ":"")+(page===h?"on":"")} onClick={()=>nav(h)} title={l}><Ic n={i}/><span className="t">{l}</span></button>;
 const nav=h=>{go(h);setOpen(false)};
 const clickHistory=()=>{
  const next=!hist;
  setHist(next);
  if(!isH)nav("rec-reports");
 };
 const isAtlas=dbInfo?.databaseMode==="MONGODB_ATLAS_CLOUD"||(dbInfo?.databaseHost&&String(dbInfo.databaseHost).includes("mongodb.net"));
 const roleLabel=curUser?.role==="ADMINISTRATOR"?"Higher Authority":curUser?.role==="SUPERVISOR"?"Supervisor":(curUser?.role||"Authenticated");
 return <div className="shell"><aside className={"side-nav "+(ex?"":"col ")+(open?"open ":"")+(hov&&!pin?"hov":"")} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}><div className="brand"><Logo/></div>
 {visibleNav.slice(0,-1).map(x=>it(x))}<button className={"nv "+(isH?"on":"")} onClick={clickHistory} title="History"><Ic n="clock"/><span className="t">History</span><span className="t" style={{marginLeft:"auto"}}><span style={{display:"inline-flex",transform:hist?"rotate(180deg)":"none"}}><Ic n="down"/></span></span></button>{hist&&HIST.map(x=>it(x,true))}{it(visibleNav[visibleNav.length-1])}
 <div style={{flex:1}}/><button className="nv" onClick={()=>setDark(!dark)}><Ic n={dark?"sun":"moon"}/><span className="t">{dark?"Light mode":"Dark mode"}</span></button>
 
 <button className="nv" onClick={onLogout}><Ic n="out"/><span className="t">Logout</span></button></aside>
 <div className={"main-c "+(pin?"":"col")}><div className="top"><button className="btn burger" aria-label="Toggle navigation" onClick={()=>innerWidth<=700?setOpen(!open):setPin(!pin)}><Ic n="menu"/></button><h1>{title}</h1><span className="pill live" style={{margin:0,cursor:"pointer"}} onClick={()=>go("cloud")} title="Click to open Cloud Integration Console"><span className={"dot "+(dbOnline?"":"r")}/>{dbOnline?(isAtlas?`MongoDB Atlas Cloud (${cloudSync?.syncedCount??0} synced)`:`Local MongoDB (${cloudSync?.syncedCount??0} synced)`):"System online"}</span><span className="bd" style={{cursor:"pointer"}} onClick={()=>go("signin")} title="Switch Account / Role">{curUser?`${curUser.name} · ${roleLabel}`:"Signing in..."}</span><Av name={curUser?.name||"User"}/></div>
 <div className="page">{page==="live"&&<Live zones={zones}/>}{page==="attendance"&&<Attend dbWorkers={dbWorkers}/>}{page==="reports"&&<Reports zones={zones}/>}{page==="zones"&&<Zones zones={zones} setZones={setZones} dbWorkers={dbWorkers} reloadDb={loadMongoData} curUser={curUser}/>}{page==="supervisors"&&<SupervisorsPage zones={zones} curUser={curUser}/>}{page==="cloud"&&<CloudConsole/>}{page==="chat"&&<Chat/>}{page==="rec-videos"&&<RecVideos/>}{page==="rec-attendance"&&<RecAttend dbWorkers={dbWorkers}/>}{page==="rec-reports"&&<RecReports curUser={curUser}/>}
 {page==="prefs"&&<div className="card" style={{maxWidth:520}}><h3>Appearance &amp; Session</h3><p style={{margin:"8px 0 14px"}}>Signed in as <b>{curUser?.name}</b> (<code>{curUser?.email}</code> · {roleLabel}).</p><div className="tabs" style={{marginBottom:14}}><button className={!dark?"on":""} onClick={()=>setDark(false)}>Light</button><button className={dark?"on":""} onClick={()=>setDark(true)}>Dark</button></div><div><button className="btn red" onClick={onLogout}><Ic n="out"/>Sign Out of Session</button></div></div>}</div></div></div>}

function App(){
 const get=()=>location.hash.slice(1)||"home";const [pg,setPg]=useState(get());
 const [dark,setDark]=useState(()=>{try{return localStorage.getItem("we-theme")==="dark"}catch(e){return false}});
 const [authToken,setAuthToken]=useState(()=>{try{return localStorage.getItem("we-token")||""}catch(_e){return ""}});
 const [authUser,setAuthUser]=useState(()=>{try{return JSON.parse(localStorage.getItem("we-user")||"null")}catch(_e){return null}});
 useEffect(()=>{const f=()=>{setPg(get());window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
 useEffect(()=>{document.documentElement.dataset.theme=dark?"dark":"light";try{localStorage.setItem("we-theme",dark?"dark":"light")}catch(e){}},[dark]);
 const handleLogout=async()=>{
  try{
   const tok=localStorage.getItem("we-token");
   if(tok)await fetch(`${API_BASE}/auth/logout`,{method:"POST",headers:{Authorization:`Bearer ${tok}`}});
  }catch(_e){}
  try{localStorage.removeItem("we-token");localStorage.removeItem("we-user")}catch(_e){}
  setAuthToken("");setAuthUser(null);
  go("signin");
 };
 useEffect(()=>{
  const verifySession=async()=>{
   const tok=localStorage.getItem("we-token");
   if(!tok){setAuthToken("");setAuthUser(null);return}
   try{
    const r=await fetch(`${API_BASE}/auth/me`,{headers:{Authorization:`Bearer ${tok}`}});
    if(r.status===401||r.status===403){
     localStorage.removeItem("we-token");localStorage.removeItem("we-user");
     setAuthToken("");setAuthUser(null);
     return;
    }
    if(r.ok){
     const j=await r.json();
     if(j.data?.user){
      setAuthToken(tok);setAuthUser(j.data.user);
      localStorage.setItem("we-user",JSON.stringify(j.data.user));
     }
    }
   }catch(_e){}
  };
  verifySession();
 },[]);
 const handleAuthSuccess=(tok,usr)=>{setAuthToken(tok);setAuthUser(usr)};
 if(pg==="signin")return <SignIn onAuthSuccess={handleAuthSuccess} existingUser={authToken?authUser:null} onLogout={handleLogout}/>;
 if(ALL.some(n=>n[0]===pg)){
  if(!authToken){
   return <SignIn onAuthSuccess={handleAuthSuccess} existingUser={null} onLogout={handleLogout}/>;
  }
  return <Shell page={pg} dark={dark} setDark={setDark} curUser={authUser} setCurUser={setAuthUser} onLogout={handleLogout}/>;
 }
 return <Home/>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
