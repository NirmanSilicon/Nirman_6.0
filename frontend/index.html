function Live({zones}){

function App(){
 const get=()=>location.hash.slice(1)||"home";const [pg,setPg]=useState(get());
 const [dark,setDark]=useState(()=>{try{return localStorage.getItem("we-theme")==="dark"}catch(e){return false}});
 useEffect(()=>{const f=()=>{setPg(get());window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
 useEffect(()=>{document.documentElement.dataset.theme=dark?"dark":"light";try{localStorage.setItem("we-theme",dark?"dark":"light")}catch(e){}},[dark]);
 useEffect(()=>{
  const ensureToken=async()=>{
   try{
    if(localStorage.getItem("we-token"))return;
    const res=await fetch(`${API_BASE}/auth/login`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:"admin@smartppe.local",password:"AdminPassword123!"})});
    if(res.ok){const j=await res.json();if(j.success&&j.data?.token){localStorage.setItem("we-token",j.data.token);localStorage.setItem("we-user",JSON.stringify(j.data.user))}}
   }catch(_e){}
  };
  ensureToken();
 },[]);
 if(pg==="signin")return <SignIn/>;
 if(ALL.some(n=>n[0]===pg))return <Shell page={pg} dark={dark} setDark={setDark}/>;
 return <Home/>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
