[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uqual-ml"
version = "0.3.0"
description = "Auditable cashflow ML research pipeline for UQUAL"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.2.6", "pandas==2.2.3", "pyarrow==19.0.1",
  "scikit-learn==1.6.1", "lightgbm==4.6.0", "xgboost==3.0.2",
  "shap==0.48.0", "joblib==1.4.2", "fastapi==0.115.12",
  "uvicorn==0.34.2", "pydantic==2.11.5",
  "python-multipart==0.0.20",
  "cryptography==50.0.2",
  "pdfplumber==0.11.10", "reportlab==4.4.4", "openpyxl==3.1.5", "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.13"]
kaggle = ["kaggle>=1.7,<3"]

[project.scripts]
uqual = "uqual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
