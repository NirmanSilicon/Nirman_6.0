[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidyutsync"
version = "0.1.0"
description = "VidyutSync (EcoSync-Industrial): Regenerative micro-grid & renewable load-shifting orchestrator for small/medium manufacturing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "VidyutSync Team", email = "info@vidyutsync.io" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Energy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "paho-mqtt>=2.0.0",
    "asyncua>=1.1.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "accelerate>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.scripts]
vidyutsync-api = "src.api.main:run_server"
vidyutsync-train = "src.models.training_pipeline:main"
vidyutsync-gen-data = "src.models.dataset_generator:main"
vidyutsync-opcua-sim = "src.connectors.opcua_bridge:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
