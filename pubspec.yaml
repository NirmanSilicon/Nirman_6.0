publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.0.3
  cloud_functions: ^6.0.3
  encrypt: ^5.0.3
  firebase_auth: ^6.1.0
  firebase_messaging: ^16.0.3
